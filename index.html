<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Responsive Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="upload-container">
        <label for="image-picker" class="upload-btn">
            📷 تغيير الصورة الخلفية
        </label>
        <input type="file" id="image-picker" accept="image/*" style="display: none;">
    </div>

    <div class="container">
        <div class="custom-bg-image" id="bg-preview"></div>
        
        <div class="pink-sphere"></div>

        <div class="glass-panel" id="glassPanel">
            <div class="top-date">
                <h1>Jan</h1>
                <h2>2025</h2>
            </div>
            
            <div class="middle-info">
                <p>Selasa 06</p>
                <p>January 2025</p>
                <p class="source">Pinterest</p>
            </div>

            <div class="logo-area">
                <div class="logo-icon"><span>cs+</span></div>
                <p>Creative.style</p>
            </div>
        </div>

        <div class="right-content" id="rightContent">
            <div class="headline">
                <p>Minimalism style</p>
                <p>Typography</p>
            </div>

            <button class="click-btn">
                <span>Click Here</span>
                <div class="arrow-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
